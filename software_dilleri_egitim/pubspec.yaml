name: software_dilleri_egitim
description: Yazilim dilleri egitim uygulamasi (offline icerik + test + ilerleme).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0
  shared_preferences: ^2.2.3
  flutter_markdown: ^0.7.7
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.6.6
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#07090D"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png

flutter_native_splash:
  color: "#07090D"
  image: assets/branding/splash.png
  android_12:
    color: "#07090D"
    image: assets/branding/splash.png

flutter:
  uses-material-design: true
  assets:
    - assets/content/catalog.json
    - assets/python/
    - assets/logos/
    - assets/branding/
